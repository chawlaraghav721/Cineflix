<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/cineflix-icon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Details</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ratings.css">
    <script src="js/my-list-storage.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/catalogue.js" defer></script>
    <script src="js/details.js" defer></script>
    <script src="js/ratings.js" defer></script>
    <script src="js/details-integration.js" defer></script>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/cineflix-icon.png" alt="CineFlix Logo">
            CineFlix
        </a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="shows.html">TV Shows</a></li>
                <li><a href="mylist.html">My List</a></li>
                <li><a href="login.html" class="login-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="details" aria-live="polite" aria-busy="true">
        <p id="details-loading" class="details-loading" role="status">Loading title details…</p>

        <section id="details-content" class="details-layout" hidden aria-labelledby="details-title">
            <div class="details-poster-wrap">
                <img id="details-poster" class="details-poster" alt="" hidden>
                <div id="details-poster-fallback" class="details-poster-fallback" hidden role="img" aria-label="Poster unavailable">Poster unavailable</div>
            </div>
            <div class="details-content">
                <h1 id="details-title"></h1>
                <p id="details-meta" class="details-meta"></p>
                <p id="details-description" class="details-description"></p>
                <p class="details-credits"><strong>Cast:</strong> <span id="details-cast"></span></p>
                <p class="details-credits"><strong>Director:</strong> <span id="details-director"></span></p>
                <div class="details-actions">
                    <button id="trailer-button" class="btn" type="button" hidden disabled>Watch Trailer</button>
                    <button id="watchlist-button" class="btn secondary" type="button" disabled>Add to My List</button>
                </div>
                <p id="watchlist-status" class="details-watchlist-status" role="status" aria-live="polite"></p>
                <section class="personal-rating" aria-labelledby="personal-rating-title" hidden>
                    <h2 id="personal-rating-title">Your Personal Rating</h2>
                    <p>How would you rate this title?</p>
                    <div class="rating-stars" role="group" aria-label="Choose a rating from 1 to 5 stars">
                        <button type="button" data-rating="1" aria-label="1 star — Not for me" aria-pressed="false">
                            <span class="rating-emoji" aria-hidden="true">😠</span>
                            <span class="rating-value">1 star</span>
                            <span class="rating-label">Not for me</span>
                        </button>
                        <button type="button" data-rating="2" aria-label="2 stars — It was okay" aria-pressed="false">
                            <span class="rating-emoji" aria-hidden="true">😐</span>
                            <span class="rating-value">2 stars</span>
                            <span class="rating-label">It was okay</span>
                        </button>
                        <button type="button" data-rating="3" aria-label="3 stars — Good" aria-pressed="false">
                            <span class="rating-emoji" aria-hidden="true">🙂</span>
                            <span class="rating-value">3 stars</span>
                            <span class="rating-label">Good</span>
                        </button>
                        <button type="button" data-rating="4" aria-label="4 stars — Loved it" aria-pressed="false">
                            <span class="rating-emoji" aria-hidden="true">😍</span>
                            <span class="rating-value">4 stars</span>
                            <span class="rating-label">Loved it</span>
                        </button>
                        <button type="button" data-rating="5" aria-label="5 stars — Absolutely fantastic!" aria-pressed="false">
                            <span class="rating-emoji" aria-hidden="true">🤩</span>
                            <span class="rating-value">5 stars</span>
                            <span class="rating-label">Absolutely fantastic!</span>
                        </button>
                    </div>
                    <p id="rating-message" role="status" aria-live="polite">No rating selected yet.</p>
                    <button type="button" id="clear-rating" disabled>Clear Rating</button>
                </section>
            </div>
        </section>

        <div id="details-error" class="details-error" role="alert" hidden></div>
    </main>

    <div id="trailer-modal" class="trailer-modal" role="dialog" aria-modal="true" aria-labelledby="trailer-title" hidden>
        <div class="trailer-dialog">
            <h2 id="trailer-title" class="trailer-dialog-title">Trailer preview</h2>
            <button id="close-trailer" class="trailer-close" type="button" aria-label="Close trailer">&times;</button>
            <div class="trailer-frame-wrap">
                <iframe id="trailer-frame" title="Movie trailer" tabindex="0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">
            <h3>CineFlix</h3>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="index.html#contact-form">Contact</a>
                <a href="#">Privacy</a>
            </div>
            <p>© 2026 CineFlix. College Project.</p>
        </div>
    </footer>

</body>
</html>
