
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            <img src="images/cineflix-icon.png" alt="CineFlix Logo">
            CineFlix
        </a>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="movies.html">Movies</a>
                </li>

                <li>
                    <a href="shows.html">TV Shows</a>
                </li>

                <li>
                    <a href="mylist.html">My List</a>
                </li>

                <li>
                    <a href="login.html" class="login-link">Login</a>
                </li>

            </ul>
        </nav>

    </header>

    <main class="login-page">

        <div class="login-box">

            <h1>Sign In</h1>

            <form id="login-form" novalidate>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
                <p id="email-error" class="field-error" aria-live="polite"></p>

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <p id="password-error" class="field-error" aria-live="polite"></p>

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <label for="remember">Remember me</label>

                </div>

                <button type="submit" class="btn">
                    Sign In
                </button>

                <p id="login-feedback" role="status" aria-live="polite"></p>

            </form>

            <p class="login-extra">
                New to CineFlix?
                <a href="#">Sign up now</a>
            </p>

        </div>

    </main>

    <footer class="footer">

        <div class="footer-bottom">

            <h3>CineFlix</h3>

            <div class="footer-links">

                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="#">Privacy</a>

            </div>

            <p>
                © 2026 CineFlix. College Project.
            </p>

        </div>

    </footer>

</body>
</html>
