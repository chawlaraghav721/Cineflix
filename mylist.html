<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - My List</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navigation Bar -->

    <header class="navbar">

        <a href="index.html" class="logo">
            CineFlix
        </a>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="movies.html">Movies</a>
                </li>

                <li>
                    <a href="shows.html">TV Shows</a>
                </li>

                <li>
                    <a href="mylist.html">My List</a>
                </li>

                <li>
                    <a href="login.html" class="login-link">
                        Login
                    </a>
                </li>

            </ul>
        </nav>

    </header>

    <!-- My List -->

    <main class="container">

          <h1 class="page-title">My List</h1>

          <p class="page-intro">
               Your saved movies and shows.
          </p>

          <!-- Search Box -->
          <input
               class="search-box"
               type="text"
               placeholder="Search your list..."
          >

          <section class="movie-section">

               <div class="movie-grid">

                    <!-- Movie 1 -->
                    <a class="movie-card" href="details.html">

                         <img
                              src="https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"
                              alt="Inception poster"
                         >

                         <div class="movie-info">

                              <h3>Inception</h3>

                              <p>2010 • Thriller</p>

                         </div>

                    </a>


                    <!-- Movie 2 -->
                    <a class="movie-card" href="details.html">

                         <img
                              src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
                              alt="Interstellar poster"
                         >

                         <div class="movie-info">

                              <h3>Interstellar</h3>

                              <p>2014 • Sci-Fi</p>

                         </div>

                    </a>


                    <!-- Add Movie -->
                    <a href="movies.html" class="add-movie-card">

                         <div class="plus-icon">+</div>

                         <h3>Add Movies</h3>

                         <p>Browse Movies</p>

                    </a>

               </div>

          </section>

          </main>

    <!-- Footer -->

    <footer class="footer">

        <div class="footer-bottom">

            <h3>
                CineFlix
            </h3>

            <div class="footer-links">

                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="#">Privacy</a>

            </div>

            <p>
                © 2026 CineFlix. College Project.
            </p>

        </div>

    </footer>

</body>

</html>
