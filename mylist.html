<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - My List</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/my-list-storage.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/catalogue.js" defer></script>
    <script src="js/mylist.js" defer></script>
</head>

<body>
    <!-- Navigation Bar -->

    <header class="navbar">

        <a href="index.html" class="logo">
            <img src="images/cineflix-icon.png" alt="CineFlix Logo">
            CineFlix
        </a>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="movies.html">Movies</a>
                </li>

                <li>
                    <a href="shows.html">TV Shows</a>
                </li>

                <li>
                    <a href="mylist.html">My List</a>
                </li>

                <li>
                    <a href="login.html" class="login-link">
                        Login
                    </a>
                </li>

            </ul>
        </nav>

    </header>

    <!-- My List -->

    <main class="container my-list-page">

          <h1 class="page-title">My List</h1>

          <p class="page-intro">
               Your saved movies and shows.
          </p>

          <!-- Search Box -->
          <input
               id="mylist-search"
               class="search-box"
               type="text"
               aria-label="Search saved titles"
               placeholder="Search your list..."
               disabled
          >

          <div class="mylist-actions">
               <button id="mylist-clear" class="btn secondary" type="button" disabled>Clear My List</button>
               <button id="mylist-retry" class="btn" type="button" hidden>Try Again</button>
          </div>
          <p id="mylist-status" class="mylist-message" role="status">Loading your list…</p>
          <p id="mylist-error" class="mylist-message" role="alert"></p>

          <section class="movie-section" aria-label="Saved movies and shows">

               <div id="mylist-grid" class="movie-grid" aria-busy="true">

                    <!-- Add Movie -->
                    <a id="mylist-add" href="movies.html" class="add-movie-card">

                         <div class="plus-icon">+</div>

                         <h3>Add Movies</h3>

                         <p>Browse Movies</p>

                    </a>

               </div>

          </section>

          </main>

    <!-- Footer -->

    <footer class="footer">

        <div class="footer-bottom">

            <h3>
                CineFlix
            </h3>

            <div class="footer-links">

                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="#">Privacy</a>

            </div>

            <p>
                © 2026 CineFlix. College Project.
            </p>

        </div>

    </footer>

</body>

</html>
