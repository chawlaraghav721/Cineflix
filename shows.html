<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/cineflix-icon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - TV Shows</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/my-list-storage.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/catalogue.js" defer></script>
    <script src="js/catalogue-browse.js" defer></script>
    <script src="js/browse-utils.js" defer></script>
    <script src="js/shows.js" defer></script>
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            <img src="images/cineflix-icon.png" alt="CineFlix Logo">
            CineFlix
        </a>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="movies.html">Movies</a>
                </li>

                <li>
                    <a href="shows.html">TV Shows</a>
                </li>

                <li>
                    <a href="mylist.html">My List</a>
                </li>

                <li>
                    <a href="login.html" class="login-link">Login</a>
                </li>

            </ul>
        </nav>

    </header>



    <main class="container">
        <h1 class="page-title">TV Shows</h1>
        <p class="page-intro">Catch up with new stories, dramas and series from CineFlix.</p>

        <!-- TV show browsing controls -->
        <section class="browse-controls" role="search" aria-label="TV show browsing controls">
            <div class="browse-field">
                <label class="visually-hidden" for="show-search">Search TV shows</label>
                <input
                    id="show-search"
                    class="search-box"
                    type="search"
                    placeholder="Search TV shows..."
                    autocomplete="off"
                >
            </div>

            <div class="browse-field">
                <label class="visually-hidden" for="show-genre-filter">Filter TV shows by genre</label>
                <select id="show-genre-filter" class="browse-select">
                    <option value="">All genres</option>
                </select>
            </div>

            <div class="browse-field">
                <label class="visually-hidden" for="show-sort">Sort TV shows</label>
                <select id="show-sort" class="browse-select">
                    <option value="default">Original order</option>
                    <option value="title-asc">Title: A–Z</option>
                    <option value="title-desc">Title: Z–A</option>
                    <option value="year-desc">Year: Newest first</option>
                    <option value="year-asc">Year: Oldest first</option>
                </select>
            </div>
            <div class="browse-field browse-actions">
                <button id="show-reset-filters" class="browse-reset" type="button" disabled>Clear filters</button>
            </div>
        </section>

        <p id="shows-loading" class="browse-status" role="status">Loading TV shows...</p>
        <p id="shows-error" class="browse-error" role="alert" hidden></p>
        <button id="shows-retry" class="browse-reset browse-retry" type="button" hidden>Retry loading TV shows</button>
        <p id="show-results" class="browse-results" role="status" aria-live="polite"></p>
        <p id="shows-empty-state" class="browse-empty" role="status" hidden>
            No TV shows match your search or filters.
        </p>

        <!-- TV show cards are rendered from data/catalogue.json. -->
        <section class="movie-section" aria-labelledby="shows-section-title">
            <h2 id="shows-section-title">All TV Shows</h2>
            <div id="shows-grid" class="movie-grid" aria-busy="true"></div>
        </section>
    </main>

    

    <footer class="footer">

        <div class="footer-bottom">

            <h3>CineFlix</h3>

            <div class="footer-links">
                <a href="#">About</a>
                <a href="index.html#contact-form">Contact</a>
                <a href="#">Privacy</a>
            </div>

            <p>
                © 2026 CineFlix. College Project.
            </p>

        </div>

    </footer>

</body>
</html>
